# fly.toml app configuration file generated for job-applier-api-amber-shape-7118 on 2026-06-02T12:15:25+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'job-applier-api-amber-shape-7118'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app     = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  scraper = "python -m app.jobs.schedule"

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

# Scraper: runs once daily at 04:00 UTC (06:00 SAST)
[[vm]]
  processes   = ['scraper']
  memory      = '256mb'
  cpu_kind    = 'shared'
  cpus        = 1
  memory_mb   = 256
  schedule    = "0 4 * * *"
